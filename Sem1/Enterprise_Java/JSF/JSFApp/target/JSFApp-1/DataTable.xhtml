<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html">
    <h:head>
        <title>Facelet Title</title>
    </h:head>
    <h:body>
        <h:dataTable value="#{tableManagedBean.books}" var="b" border="1">
            <f:facet name="header">This is the list of Books</f:facet>

            <h:column>
                <f:facet name="header"> Book ID</f:facet>
                <h:outputText value="#{b.bookID}"></h:outputText>
            </h:column>

            <h:column>
                <f:facet name="header"> Book Name</f:facet>
                <h:outputText value="#{b.bookName}"></h:outputText>
            </h:column>

            <h:column>
                <f:facet name="header"> Author Name</f:facet>
                <h:outputText value="#{b.author}"></h:outputText>
            </h:column>

            <h:column>
                <f:facet name="header">Publisher Name</f:facet>
                <h:outputText value="#{b.publisherName}"></h:outputText>
            </h:column>

            <h:column>
                <f:facet name="header"> Synopsis</f:facet>
                <h:outputText value="#{b.synopsis}"></h:outputText>
            </h:column> 

            <f:facet name="footer">copyright</f:facet>
        </h:dataTable>


        <h:outputLink value="http://localhost:8080/JSFApp/convter.jsf">convter</h:outputLink><br/>
        <h:outputLink value="http://localhost:8080/JSFApp/events.jsf">events</h:outputLink><br/>
        <h:outputLink value="http://localhost:8080/JSFApp/person.jsf">person file one form</h:outputLink><br/>
        <h:outputLink value="http://localhost:8080/JSFApp/testcomponent.jsf">testcomponent pending</h:outputLink><br/>

    </h:body>
</html>
