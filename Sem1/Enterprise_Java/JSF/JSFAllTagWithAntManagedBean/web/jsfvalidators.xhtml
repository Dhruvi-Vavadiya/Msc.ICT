<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://xmlns.jcp.org/jsf/passthrough">
    <h:head>
        <title>Facelet Title</title>
    </h:head>
    <h:body>
        <h:form>
             <h:inputText validatorMessage="must be between 200 to 1000" p:placeholder="200 to 1000">
                <f:validateDoubleRange maximum="1000" minimum="200"/>
            </h:inputText><br/>
            <h:inputText validatorMessage="must be between 200 to 1000" p:placeholder="200 to 1000">
                <f:validateLongRange maximum="1000" minimum="200"/>
            </h:inputText><br/>
            <h:inputText validatorMessage="must be between 6 to 10" p:placeholder="6 to 10">
                <f:validateLength maximum="10" minimum="6"/>
            </h:inputText><br/>
            
            <h:inputSecret validatorMessage="must be lowercase and minimum len 6 char" p:placeholder="min 6 chr ">
                <f:validateRegex pattern="((?=.*[a-z]).{6,})"/>
            </h:inputSecret>
             <f:validateRequired />
            
            <h:commandButton value="click"/>
        </h:form>
    </h:body>
</html>
