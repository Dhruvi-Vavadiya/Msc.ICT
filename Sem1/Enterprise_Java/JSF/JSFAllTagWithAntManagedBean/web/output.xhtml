<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>Facelet Title</title>
    </h:head>
    <h:body>
        <h:form>
            <h:outputLabel value="Name::"/>
            <h:inputText id="name" required="true"/>
            <h:message for="name"/>
            <h:commandButton value="click"/>
        </h:form>
        <h:form>
            <h3>outputlabel ex label tag</h3>
            <h:outputLabel value="Enter password ::"/>
            <h:inputSecret id="pwd"/>
            
            <h3>outputlink ex anger tag</h3>
            <h:outputLink value="http://www.google.com">Google link</h:outputLink><br/>
            <h:outputLink value="http://www.google.com">
                <h:outputText value="Googlee"/>
            </h:outputLink>
            
            
             <h3>outputformat ex</h3>
             <h:outputFormat value="hii {0},heelo {1}">
                 <f:param value="Amar"/>
                 <f:param value="JSF"/>
             </h:outputFormat>
             
             
             <h3>Graphicimage image tag</h3>
             <h:graphicImage value="/pic/Penguins.jpg" alt="image could not be display" width="100" height="100" />
             
             <h3>submit button commandlink</h3>
             <h:commandLink value="myage" action="cmdbtnjsf"/>
        
        </h:form>
        
        <h3>panelgrid panelgroup</h3>
        <h:form>
            <h:panelGrid border="1" columns="3">
                
                <f:facet name="header">
                    <h:outputText value="output table header"/>
                </f:facet>
                
                
                <h:inputText/>
                <h:inputText/>
                <h:inputText/>
                <h:inputText/>
                <h:inputText/>
                <h:inputText/>
                
                <f:facet name="footer">
                    <h:panelGroup>
                        <h:outputText value="feedback"/>
                        <h:inputText />
                        <h:commandButton value="click me"/>
                    </h:panelGroup>
                </f:facet>
                
            </h:panelGrid>
        </h:form>
        
        
    </h:body>
</html>
