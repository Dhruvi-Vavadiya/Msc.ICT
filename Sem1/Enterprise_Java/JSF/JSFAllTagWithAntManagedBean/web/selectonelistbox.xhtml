<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html">
    <h:head>
        <title>Facelet Title</title>
    </h:head>
    <h:body>
        <h:form>
            <h:selectOneListbox value="#{selectonelistbox.course}">
                <f:selectItem itemLabel="pro c" itemValue="programing language c"/>
                <f:selectItem itemLabel="pro java" itemValue="programing language  java"/>
                <f:selectItem itemLabel="pro c++" itemValue=" programing language c++"/>

                <f:selectItem itemLabel="pro c#" itemValue="programing language  c#"/>
            </h:selectOneListbox>
            <h:commandButton value="Click me one"/>
            <hr/><!-- comment -->
            <h1><h:outputText value="#{selectonelistbox.course}" /></h1>
            
           
        </h:form>
        
        
        <h:form>
             <h:selectManyListbox value="#{selectonelistbox.cous}">
                <f:selectItem itemLabel="pro c" itemValue="programing language c"/>
                <f:selectItem itemLabel="pro java" itemValue="programing language  java"/>
                <f:selectItem itemLabel="pro c++" itemValue=" programing language c++"/>

                <f:selectItem itemLabel="pro c#" itemValue="programing language  c#"/>
            </h:selectManyListbox>
            <h:commandButton value="Click me many"/>
            <hr/><!-- comment -->
            <h1><h:outputText value="#{selectonelistbox.cous}" /></h1>
        </h:form>
    </h:body>
</html>
