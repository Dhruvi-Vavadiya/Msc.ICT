<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>Facelet Title</title>
    </h:head>
    <h:body>
        <h:form>
            <!--f:selectItem-->
            <h:selectManyCheckbox value="#{selectmanychk.cou}">
                <f:selectItem itemLabel="pro c" itemValue="c"/>
                <f:selectItem itemLabel="pro c++" itemValue="c++"/>
                <f:selectItem itemLabel="pro java" itemValue="java"/>
                <f:selectItem itemLabel="pro c#" itemValue="c#"/>
            </h:selectManyCheckbox>
            <h:commandButton value="Click me selectitem"/>
            <h:outputText value="#{selectmanychk.cou}"/>
            
            <!--f:selectItems-->
            <h:selectManyCheckbox>
                <f:selectItems value="#{selectmanychk.items}"/>
            </h:selectManyCheckbox>
             <h:commandButton value="Click me selectitems"/>
            <h:outputText value="#{selectmanychk.items}"/>
        </h:form>
    </h:body>
</html>
